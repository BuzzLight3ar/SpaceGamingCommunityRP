name: "Buzz QBCore + EUP"
version: "1.0.0"
author: "Buzz"

tasks:
  # Create folders
  - action: create_dir
    path: ./resources
  - action: create_dir
    path: ./resources/[qb]
  - action: create_dir
    path: ./resources/[standalone]
  - action: create_dir
    path: ./resources/[eup]

  # QBCore
  - action: download_github
    src: https://github.com/qbcore-framework/qb-core
    ref: main
    dest: ./resources/[qb]/qb-core

  - action: download_github
    src: https://github.com/qbcore-framework/qb-smallresources
    ref: main
    dest: ./resources/[qb]/qb-smallresources

  # ox_lib
  - action: download_github
    src: https://github.com/overextended/ox_lib
    ref: main
    dest: ./resources/[standalone]/ox_lib

  # EUP Menu
  - action: download_github
    src: https://github.com/Native-Software/eup-ui
    ref: main
    dest: ./resources/[eup]/eup-ui

  # EUP Pack (placeholder pack)
  - action: download_github
    src: https://github.com/Native-Software/eup-pack
    ref: main
    dest: ./resources/[eup]/eup-pack

  # Server.cfg
  - action: write_file
    path: ./server.cfg
    data: |
      sv_hostname "Buzz QBCore + EUP Server"
      sv_maxclients 48

      # Database
      set mysql_connection_string "mysql://root:password@127.0.0.1/qbcore?charset=utf8mb4"

      # Resources
      ensure ox_lib
      ensure qb-core
      ensure qb-smallresources
      ensure eup-ui
      ensure eup-pack

      # Permissions
      add_ace group.admin command allow
      add_principal identifier.fivem:YOUR_FIVEM_ID group.admin

      # License
      sv_licenseKey "CHANGE_ME"

  # SQL Import
  - action: run_sql
    file: ./resources/[qb]/qb-core/sql/qbcore.sql
